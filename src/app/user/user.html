@if (isLogged()) {
<button
    class="absolute right-5 top-5 bg-slate-800 outline-1 outline-offset-2 outline-orange-500 px-3 py-1 hover:bg-orange-500 rounded-md font-semibold transition"
    (click)="logout()">Cerrar sesión</button>
<p class="text-center text-5xl m-10  text-shadow-lg/30 text-shadow-white">Hola! {{ userName() }}</p>
<app-book />
} @else {
<div class="flex flex-col items-center h-screen justify-center">
    <div class="flex flex-col gap-1">
        <span class="">Ingresa tu nombre</span>
        <input class="border border-gray-400 px-3 py-1 rounded-sm focus:outline-none focus:border-orange-500"
            type="text" placeholder="Usuario" [value]="userName()" (input)="onInputChange($event)"
            (keydown)="onKeyDown($event)" />
    </div>
    <button
        class="mt-10 text-3xl font-semibold py-2 px-4 rounded-lg bg-orange-600 hover:bg-orange-500 transition disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-orange-600"
        [disabled]="!isNameValid()" (click)="login()">Iniciar Sesión</button>
</div>
}
