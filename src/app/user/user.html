@if (isLogged()) {
<button
    class="absolute right-5 top-5 text-gray-900 outline-1 outline-offset-2 outline-orange-300 px-3 py-1 hover:bg-orange-300 dark:text-slate-200 dark:outline-orange-500 dark:hover:bg-orange-500 rounded-md font-semibold transition"
    (click)="logout()">Cerrar sesión</button>
<p
    class="text-center text-5xl p-10 font-bold text-slate-800 dark:text-mist-100 dark:text-shadow-md dark:text-shadow-white/50">
    Hola! {{ userName()
    }}</p>
<app-book />
} @else {
<div class="flex flex-col items-center h-screen justify-center">
    <div class="flex flex-col gap-1">
        <span class="text-lg dark:text-mist-100 dark:text-shadow-md dark:text-shadow-white/50">Ingresa tu nombre</span>
        <input
            class="border border-gray-400 px-3 py-1 rounded-sm focus:outline-none dark:shadow-sm dark:shadow-white dark:text-mist-200"
            type="text" placeholder="Usuario" [value]="userName()" (input)="onInputChange($event)"
            (keydown)="onKeyDown($event)" />
    </div>
    <button
        class="mt-10 text-2xl text-gray-100 font-semibold py-2 px-4 rounded-lg dark:shadow-md dark:shadow-orange-500 bg-orange-300 dark:bg-orange-500 hover:bg-orange-400 dark:hover:bg-orange-600 transition disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-orange-600"
        [disabled]="!isNameValid()" (click)="login()">Iniciar Sesión</button>
</div>
}
